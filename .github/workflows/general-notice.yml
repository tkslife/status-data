name: Publish or clear a general notice
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to publish
        type: choice
        options: [Dev practice, Production]
        default: Dev practice
      action:
        description: Notices do not change service health or platform access
        type: choice
        options: [Publish notice, Clear notice]
      id:
        description: Reference, for example save-work (not needed when clearing)
        type: string
      message:
        description: Public message, up to 400 characters (not needed when clearing)
        type: string
      publish:
        description: Publish this change (leave unchecked to preview only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: status-operator
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Require a fresh publication request
        env:
          PUBLISH: ${{ inputs.publish }}
          ATTEMPT: ${{ github.run_attempt }}
        run: test "$PUBLISH" != true || test "$ATTEMPT" = 1
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare notice
        id: notice
        run: node scripts/operator-update.mjs advisory
      - name: Validate notice
        env:
          STATUS_FILE: ${{ steps.notice.outputs.file }}
        run: node scripts/validate.mjs "$STATUS_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: notice-preview
          path: ${{ steps.notice.outputs.file }}
          retention-days: 7
      - name: Save approved public notice
        if: inputs.publish
        env:
          STATUS_FILE: ${{ steps.notice.outputs.file }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATUS_FILE"
          git commit -m "TKS-442: update approved service notice"
          git push origin HEAD:main
      - name: Publish validated site
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run validate.yml --ref main
          echo 'Publication queued. Check the Check status file workflow, then the public page. Allow for the GitHub Pages cache.' >> "$GITHUB_STEP_SUMMARY"
